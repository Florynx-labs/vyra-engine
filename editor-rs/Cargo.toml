[package]
name = "vyra-editor"
version = "0.1.0"
edition = "2024"
publish = false
description = "GPUI-based editor shell for VYRA Engine"
build = "build.rs"

[lib]
name = "vyra_editor"
path = "src/lib.rs"

[dependencies]
# Keep both crates on the exact same upstream Zed revision.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f98c2c100d217ace3ca99564cfc4573612d43d47" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f98c2c100d217ace3ca99564cfc4573612d43d47", features = ["font-kit", "wayland", "x11"] }
